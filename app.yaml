command: ["uv", "run", "start-app"]
# databricks apps listen by default on port 8000

env:
  - name: API_PROXY
    value: "http://localhost:8000/invocations"
  - name: CHAT_APP_PORT
    value: "3000"
  - name: CHAT_PROXY_TIMEOUT_SECONDS
    value: "300"
  # Langfuse observability (optional — agent starts without these)
  - name: LANGFUSE_PUBLIC_KEY
    value: "pk-lf-091592b0-696e-4037-bd8b-8ebba8ed862e"
  - name: LANGFUSE_SECRET_KEY
    valueFrom: "langfuse-secret"
  - name: LANGFUSE_HOST
    value: "https://agentmonitoring.pertamina.ai"
  # Jakarta workspace — managed SQL MCP over the WORKSHOP_SCHEMA schema
  - name: DATABRICKS_JAKARTA_HOST
    value: "https://dbc-77e33eef-a7e4.cloud.databricks.com"
  - name: DATABRICKS_JAKARTA_CLIENT_ID
    valueFrom: "databricks-jakarta-id"
  - name: DATABRICKS_JAKARTA_CLIENT_SECRET
    valueFrom: "databricks-jakarta-secret"
  # Volume-backed wiki — OKF bundle on a Unity Catalog Volume in Jakarta
  # app.yaml is the UI/Git deploy path and has no bundle variable, so the
  # group is named here. `databricks.yml` derives it from `--var=group=...`.
  - name: WORKSHOP_SCHEMA
    value: "group_0"
