[project]
name = "agent-server"
version = "0.1.0"
description = "FastAPI agent server with OpenAI Chat Completions interface"
readme = "README.md"
authors = [
    { name = "Agent Developer", email = "developer@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "starlette>=0.41.0",   # BaseHTTPMiddleware, imported directly by start_server
    "pydantic>=2.11",      # request/response models
    # Floor raised to the version whose reasoning-block serialization
    # agent_server/utils.py parses. Below this the streaming translation of
    # thoughts is not guaranteed to match what it expects.
    "databricks-langchain>=0.20.0",
    # Imported directly (databricks.sdk.WorkspaceClient), not merely pulled in
    # by databricks-langchain — declared so a change there cannot remove it.
    "databricks-sdk>=0.139.0",
    # Also only transitive before now: utils.py imports langchain.messages and
    # agent.py imports langchain.agents.middleware for the planning middleware.
    "langchain>=1.4.1",
    # Already pulled in by databricks-langchain; declared because agent_server
    # imports mlflow.types.responses directly for the Responses API item shapes.
    "mlflow>=3.16.1",
    "langgraph>=1.2.11",
    "langchain-mcp-adapters>=0.2.1",
    "python-dotenv>=1.2.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "langfuse>=4.15.4",
    "httpx>=0.27.0",
    "deepagents>=0.7.15",
    # Transitive until now (via mlflow). Declared because agent_server/okf.py
    # parses OKF frontmatter with it, and a document whose frontmatter cannot be
    # read is a conformance failure rather than a missing nicety.
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "pytest>=9.0.2",
]

setup = [
    "ruamel.yaml>=0.18.0",
]

[tool.uv]
default-groups = ["dev", "setup"]


[project.scripts]
quickstart = "scripts.quickstart:main"
start-app = "scripts.start_app:main"
start-server = "agent_server.start_server:main"
discover-tools = "scripts.discover_tools:main"
preflight = "scripts.preflight:main"
agent-evaluate = "agent_evaluation.runner:main"
seed-wiki = "scripts.seed_wiki:main"
check-okf = "scripts.check_okf:main"
check-skills = "scripts.check_skills:main"
measure-skill-selection = "scripts.measure_skill_selection:main"
