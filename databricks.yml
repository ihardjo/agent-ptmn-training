bundle:
  name: agent_langgraph

# The one value a `group-N` branch changes. Everything below derives from it —
# app name, secret scope, schema and Volume — so a branch differs from `main`
# by this line and a fix merged into eight branches collides on nothing else.
#
#   databricks bundle deploy --var="group=group_3"
#
# `default` keeps `main` deployable as it stands.
variables:
  group:
    description: Per-instance suffix, hyphenated (default, group-0 .. group-7)
    default: default

resources:
  apps:
    agent_langgraph:
      name: "agent-workshop-ai-${var.group}"
      description: "LangGraph agent application"
      source_code_path: ./
      config:
        command: ["uv", "run", "start-app"]
        env:
          - name: API_PROXY
            value: "http://localhost:8000/invocations"
          - name: CHAT_APP_PORT
            value: "3000"
          - name: CHAT_PROXY_TIMEOUT_SECONDS
            value: "300"
          # Langfuse observability (optional — agent starts without these)
          - name: LANGFUSE_PUBLIC_KEY
            value: "pk-lf-6d228091-5dfd-4622-bc7c-4b778ad93daf"
          - name: LANGFUSE_SECRET_KEY
            value_from: "langfuse-secret"
          - name: LANGFUSE_HOST
            value: "https://agentmonitoring.pertamina.ai"
          # Jakarta workspace — managed SQL MCP over workshop_ai_platform.${var.group}
          - name: DATABRICKS_JAKARTA_HOST
            value: "https://dbc-77e33eef-a7e4.cloud.databricks.com"
          - name: DATABRICKS_JAKARTA_CLIENT_ID
            value_from: "databricks-jakarta-id"
          - name: DATABRICKS_JAKARTA_CLIENT_SECRET
            value_from: "databricks-jakarta-secret"
          # Volume-backed wiki — OKF bundle on a Unity Catalog Volume in Jakarta
          - name: WORKSHOP_GROUP
            value: "${var.group}"

      # Resources which this app has access to
      resources:
        - name: 'langfuse-secret'
          secret:
            scope: agent-${var.group}
            key: langfuse-secret-key
            permission: 'READ'
        - name: 'databricks-jakarta-id'
          secret:
            scope: agent-${var.group}
            key: databricks-jakarta-id
            permission: 'READ'
        - name: 'databricks-jakarta-secret'
          secret:
            scope: agent-${var.group}
            key: databricks-jakarta-secret
            permission: 'READ'

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-2097a69c-b1b8.cloud.databricks.com

  prod:
    mode: production
    # workspace:
    #   host: https://...
    resources:
      apps:
        agent_langgraph:
          name: agent-langgraph
